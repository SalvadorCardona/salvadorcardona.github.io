name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un seul déploiement à la fois. Les pushes qui arrivent pendant un déploiement
# attendent leur tour au lieu de l'annuler : on ne veut pas publier un site
# à moitié construit.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Vérification des types
        run: npm run typecheck

      - name: Build statique (prérendu + sitemap + 404.html)
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
