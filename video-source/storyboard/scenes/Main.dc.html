<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Du tableur à l'application</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;display=swap">
<style>
body{margin:0;font-family:'Bricolage Grotesque',system-ui,sans-serif;background:#1c1917;color:#1d1d1b}
a{color:#e46212}a:hover{color:#c2410c}
@keyframes cdSheet{0%,14%{opacity:1;transform:none}32%,90%{opacity:.32;transform:translateX(-8px) scale(.96)}100%{opacity:1;transform:none}}
@keyframes cdArrow{0%,18%{opacity:0;transform:translateX(-14px)}28%,90%{opacity:1;transform:none}100%{opacity:0;transform:translateX(-14px)}}
@keyframes cdB1{0%,26%{opacity:0;transform:translateY(16px)}34%,90%{opacity:1;transform:none}100%{opacity:0;transform:translateY(16px)}}
@keyframes cdB2{0%,34%{opacity:0;transform:translateY(16px)}42%,90%{opacity:1;transform:none}100%{opacity:0;transform:translateY(16px)}}
@keyframes cdB3{0%,42%{opacity:0;transform:translateY(16px)}50%,90%{opacity:1;transform:none}100%{opacity:0;transform:translateY(16px)}}
@keyframes cdB4{0%,50%{opacity:0;transform:translateY(16px)}58%,90%{opacity:1;transform:none}100%{opacity:0;transform:translateY(16px)}}
@keyframes cdB5{0%,58%{opacity:0;transform:scale(.6)}64%{opacity:1;transform:scale(1.08)}68%,90%{opacity:1;transform:none}100%{opacity:0;transform:scale(.6)}}
.cd-sheet{animation:cdSheet 7s ease-in-out infinite}
.cd-arrow{animation:cdArrow 7s ease-in-out infinite}
.cd-b1{animation:cdB1 7s ease-out infinite}
.cd-b2{animation:cdB2 7s ease-out infinite}
.cd-b3{animation:cdB3 7s ease-out infinite}
.cd-b4{animation:cdB4 7s ease-out infinite}
.cd-b5{animation:cdB5 7s ease-out infinite}
@media (prefers-reduced-motion: reduce){.cd-sheet,.cd-arrow,.cd-b1,.cd-b2,.cd-b3,.cd-b4,.cd-b5{animation:none}}
</style>
</helmet>
<div style="width: 1280px; height: 720px; box-sizing: border-box; position: relative; overflow: hidden; background: #1c1917; font-family: 'Bricolage Grotesque', system-ui, sans-serif">

<div style="position: absolute; left: 96px; top: 64px; display: flex; align-items: center; gap: 14px"><svg width="40" height="40" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="13" fill="#e46212"></rect><path d="M30.78 16.22A11 11 0 1 0 30.78 31.78" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"></path><circle cx="36.5" cy="24" r="3.75" fill="#fff"></circle></svg><span style="font-weight: 700; font-size: 28px; color: #fafaf9; letter-spacing: -0.02em">Cardona</span></div>

<h1 style="position: absolute; left: 96px; top: 136px; margin: 0; font-size: 64px; line-height: 1.02; font-weight: 800; letter-spacing: -0.03em; color: #fafaf9">Du tableur à une<br><span style="color: {{accent}}">vraie application.</span></h1>

<div style="position: absolute; left: 96px; right: 96px; top: 330px; height: 300px; display: flex; align-items: center; gap: 28px">

<div class="cd-sheet" style="width: 380px; height: 272px; flex-shrink: 0; box-sizing: border-box; background: #292524; border: 1px solid #44403c; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 6px">
<div style="display: grid; grid-template-columns: 26px repeat(4, minmax(0, 1fr)); gap: 6px; font-size: 13px; color: #78716c; text-align: center"><div></div><div>A</div><div>B</div><div>C</div><div>D</div></div>
<div style="display: grid; grid-template-columns: 26px repeat(4, minmax(0, 1fr)); gap: 6px; height: 28px"><div style="font-size: 13px; color: #78716c; text-align: center; line-height: 28px">1</div><div style="background: #3a3532; border-radius: 4px"></div><div style="background: #3a3532; border-radius: 4px"></div><div style="background: #3a3532; border-radius: 4px"></div><div style="background: #3a3532; border-radius: 4px"></div></div>
<div style="display: grid; grid-template-columns: 26px repeat(4, minmax(0, 1fr)); gap: 6px; height: 28px"><div style="font-size: 13px; color: #78716c; text-align: center; line-height: 28px">2</div><div style="background: #3a3532; border-radius: 4px"></div><div style="background: #5c2c12; border-radius: 4px"></div><div style="background: #3a3532; border-radius: 4px"></div><div style="background: #3a3532; border-radius: 4px"></div></div>
<div style="display: grid; grid-template-columns: 26px repeat(4, minmax(0, 1fr)); gap: 6px; height: 28px"><div style="font-size: 13px; color: #78716c; text-align: center; line-height: 28px">3</div><div style="background: #3a3532; border-radius: 4px"></div><div style="background: #3a3532; border-radius: 4px"></div><div style="background: #3a3532; border-radius: 4px"></div><div style="background: #5c2c12; border-radius: 4px"></div></div>
<div style="display: grid; grid-template-columns: 26px repeat(4, minmax(0, 1fr)); gap: 6px; height: 28px"><div style="font-size: 13px; color: #78716c; text-align: center; line-height: 28px">4</div><div style="background: #3a3532; border-radius: 4px"></div><div style="background: #3a3532; border-radius: 4px"></div><div style="background: #3a3532; border-radius: 4px"></div><div style="background: #3a3532; border-radius: 4px"></div></div>
<div style="display: grid; grid-template-columns: 26px repeat(4, minmax(0, 1fr)); gap: 6px; height: 28px"><div style="font-size: 13px; color: #78716c; text-align: center; line-height: 28px">5</div><div style="background: #5c2c12; border-radius: 4px"></div><div style="background: #3a3532; border-radius: 4px"></div><div style="background: #3a3532; border-radius: 4px"></div><div style="background: #3a3532; border-radius: 4px"></div></div>
<div style="display: grid; grid-template-columns: 26px repeat(4, minmax(0, 1fr)); gap: 6px; height: 28px"><div style="font-size: 13px; color: #78716c; text-align: center; line-height: 28px">6</div><div style="background: #3a3532; border-radius: 4px"></div><div style="background: #3a3532; border-radius: 4px"></div><div style="background: #3a3532; border-radius: 4px"></div><div style="background: #3a3532; border-radius: 4px"></div></div>
</div>

<div class="cd-arrow" style="flex-shrink: 0"><svg width="64" height="40" viewBox="0 0 64 40" fill="none" stroke="#e46212" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h52"></path><path d="M42 6l14 14-14 14"></path></svg></div>

<div style="flex-grow: 1; height: 300px; box-sizing: border-box; background: #faf7f2; border-radius: 22px; display: flex; overflow: hidden; position: relative">
<div class="cd-b1" style="width: 132px; flex-shrink: 0; background: #f0ebe4; padding: 22px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px"><div style="width: 22px; height: 22px; border-radius: 7px; background: #e46212"></div><div style="width: 54px; height: 9px; border-radius: 5px; background: #a8a29e"></div></div>
<div style="padding: 8px 10px; border-radius: 9px; background: #e46212; color: #ffffff; font-size: 14px; font-weight: 600">Planning</div>
<div style="padding: 8px 10px; font-size: 14px; color: #57534e">Clients</div>
<div style="padding: 8px 10px; font-size: 14px; color: #57534e">Devis</div>
<div style="padding: 8px 10px; font-size: 14px; color: #57534e">Factures</div>
</div>
<div style="flex-grow: 1; padding: 22px 24px; display: flex; flex-direction: column; gap: 14px">
<div class="cd-b2" style="display: flex; align-items: center; justify-content: space-between"><div style="font-size: 22px; font-weight: 700; color: #1d1d1b; letter-spacing: -0.02em">Cette semaine</div><div style="padding: 8px 14px; border-radius: 10px; background: #1d1d1b; color: #fafaf9; font-size: 14px; font-weight: 600">+ Nouveau</div></div>
<div class="cd-b3" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<div style="height: 54px; border-radius: 12px; background: #ffffff; border: 1px solid #e7e5e4; padding: 10px 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px"><div style="width: 50%; height: 7px; border-radius: 4px; background: #d6d3d1"></div><div style="width: 70%; height: 12px; border-radius: 6px; background: #e46212"></div></div>
<div style="height: 54px; border-radius: 12px; background: #ffffff; border: 1px solid #e7e5e4; padding: 10px 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px"><div style="width: 60%; height: 7px; border-radius: 4px; background: #d6d3d1"></div><div style="width: 45%; height: 12px; border-radius: 6px; background: #1d1d1b"></div></div>
<div style="height: 54px; border-radius: 12px; background: #ffffff; border: 1px solid #e7e5e4; padding: 10px 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px"><div style="width: 40%; height: 7px; border-radius: 4px; background: #d6d3d1"></div><div style="width: 60%; height: 12px; border-radius: 6px; background: #1d1d1b"></div></div>
</div>
<div class="cd-b4" style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 12px; background: #ffffff; border: 1px solid #e7e5e4"><div style="width: 26px; height: 26px; border-radius: 50%; background: #fdf1e8"></div><div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px"><div style="width: 45%; height: 8px; border-radius: 4px; background: #57534e"></div><div style="width: 28%; height: 6px; border-radius: 3px; background: #d6d3d1"></div></div><div style="padding: 4px 10px; border-radius: 999px; background: #dcfce7; color: #166534; font-size: 12px; font-weight: 600">Confirmé</div></div>
<div style="display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 12px; background: #ffffff; border: 1px solid #e7e5e4"><div style="width: 26px; height: 26px; border-radius: 50%; background: #fdf1e8"></div><div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px"><div style="width: 38%; height: 8px; border-radius: 4px; background: #57534e"></div><div style="width: 22%; height: 6px; border-radius: 3px; background: #d6d3d1"></div></div><div style="padding: 4px 10px; border-radius: 999px; background: #fdf1e8; color: #b4480b; font-size: 12px; font-weight: 600">Relancer</div></div>
</div>
</div>
<div class="cd-b5" style="position: absolute; right: 18px; bottom: 18px; display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 12px; background: #1d1d1b; color: #fafaf9; font-size: 14px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e46212" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Devis envoyé</div>
</div>

</div>

<p style="position: absolute; left: 0; right: 0; bottom: 36px; margin: 0; text-align: center; font-size: 22px; line-height: 1.4; color: #e7e5e4; font-weight: 400">Vos tableurs deviennent une vraie application, pensée pour votre métier.</p>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent": {"editor": "color", "default": "#e46212", "options": ["#e46212", "#c2410c", "#1d1d1b"]}, "$preview": {"width": 1280, "height": 720}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#e46212' };
  }
}
</script>
</body>
</html>
