<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Services</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;display=swap">
<style>
body{margin:0;font-family:'Bricolage Grotesque',system-ui,sans-serif;background:#faf7f2;color:#1d1d1b}
a{color:#e46212}a:hover{color:#c2410c}
.sv-bar{transform-box:fill-box;transform-origin:50% 100%;animation:svBar 4s ease-in-out infinite}
.sv-bar2{animation-delay:.25s}.sv-bar3{animation-delay:.5s}.sv-bar4{animation-delay:.75s}
@keyframes svBar{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}
.sv-phone{animation:svFloat 5s ease-in-out infinite}
@keyframes svFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.sv-lens{animation:svLens 6s ease-in-out infinite}
@keyframes svLens{0%,100%{transform:translate(0,0)}40%,60%{transform:translate(0,44px)}}
.sv-bug{animation:svBug 6s ease-in-out infinite}
@keyframes svBug{0%,40%{fill:#fecaca}55%,100%{fill:#dcfce7}}
.sv-check{transform-box:fill-box;transform-origin:center;animation:svPop 6s ease-out infinite}
@keyframes svPop{0%,52%{opacity:0;transform:scale(.5)}60%{opacity:1;transform:scale(1.1)}66%,100%{opacity:1;transform:none}}
.sv-spark{transform-box:fill-box;transform-origin:center;animation:svSpin 6s linear infinite}
@keyframes svSpin{to{transform:rotate(360deg)}}
.sv-type{transform-box:fill-box;transform-origin:0 50%;animation:svType 5s ease-out infinite}
.sv-type2{animation-delay:.4s}.sv-type3{animation-delay:.8s}
@keyframes svType{0%,10%{transform:scaleX(0)}40%,100%{transform:scaleX(1)}}
.sv-dot{animation:svDot 1.2s ease-in-out infinite}
.sv-dot2{animation-delay:.2s}.sv-dot3{animation-delay:.4s}
@keyframes svDot{0%,100%{opacity:.3}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){.sv-bar,.sv-phone,.sv-lens,.sv-bug,.sv-check,.sv-spark,.sv-type,.sv-dot{animation:none}}
</style>
</helmet>

<rect class="sv-bar" x="96" y="98" width="16" height="52" rx="3" fill="#e46212"></rect>
<rect class="sv-bar sv-bar2" x="120" y="112" width="16" height="38" rx="3" fill="#f6b98e"></rect>
<rect class="sv-bar sv-bar3" x="144" y="90" width="16" height="60" rx="3" fill="#e46212"></rect>
<rect class="sv-bar sv-bar4" x="168" y="106" width="16" height="44" rx="3" fill="#f6b98e"></rect>
<rect x="192" y="88" width="26" height="62" rx="5" fill="#ffffff" stroke="#e7e5e4"></rect>
<path d="M20 168h228l-12 12H32z" fill="#44403c"></path>
<g class="sv-phone">
<rect x="214" y="96" width="58" height="104" rx="11" fill="#1d1d1b"></rect>

<rect x="225" y="126" width="36" height="20" rx="5" fill="#fdf1e8"></rect>

<rect x="225" y="164" width="24" height="6" rx="3" fill="#d6d3d1"></rect>
<rect x="225" y="176" width="36" height="10" rx="5" fill="#e46212"></rect>
</g>
</svg></div>
<div style="display: flex; flex-direction: column; gap: 6px; padding: 0 12px"><div style="font-size: 32px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1">Applications web</div><div style="font-size: 24px; color: #57534e">sur mesure</div></div>
</div>

<div style="display: flex; flex-direction: column; gap: 22px; padding: 22px 22px 32px; background: #ffffff; border: 1px solid #e7e5e4; border-radius: 24px">

<rect x="30" y="30" width="190" height="160" rx="12" fill="#1d1d1b"></rect>
<circle cx="46" cy="44" r="4" fill="#57534e"></circle><circle cx="58" cy="44" r="4" fill="#57534e"></circle><circle cx="70" cy="44" r="4" fill="#57534e"></circle>
<rect x="44" y="62" width="60" height="7" rx="3.5" fill="#f6b98e"></rect><rect x="110" y="62" width="70" height="7" rx="3.5" fill="#78716c"></rect>
<rect x="56" y="80" width="90" height="7" rx="3.5" fill="#a8a29e"></rect>
<rect class="sv-bug" x="40" y="96" width="168" height="18" rx="5" fill="#fecaca"></rect>
<rect x="56" y="102" width="110" height="7" rx="3.5" fill="#57534e"></rect>
<rect x="56" y="122" width="74" height="7" rx="3.5" fill="#a8a29e"></rect>
<rect x="44" y="140" width="50" height="7" rx="3.5" fill="#f6b98e"></rect><rect x="100" y="140" width="56" height="7" rx="3.5" fill="#78716c"></rect>
<rect x="56" y="158" width="96" height="7" rx="3.5" fill="#a8a29e"></rect>
<g class="sv-lens">
<circle cx="186" cy="62" r="26" fill="#ffffff" fill-opacity="0.25" stroke="#e46212" stroke-width="7"></circle>
<path d="M205 81l22 22" stroke="#e46212" stroke-width="10" stroke-linecap="round"></path>
</g>
<path d="M236 110l32 13v22c0 20-14 36-32 44-18-8-32-24-32-44v-22z" fill="#e46212"></path>
<path class="sv-check" d="M222 148l10 10 19-20" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"></path>
</svg></div>
<div style="display: flex; flex-direction: column; gap: 6px; padding: 0 12px"><div style="font-size: 32px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1">Audit de sécurité</div><div style="font-size: 24px; color: #57534e">de l'existant</div></div>
</div>

<div style="display: flex; flex-direction: column; gap: 22px; padding: 22px 22px 32px; background: #ffffff; border: 1px solid #e7e5e4; border-radius: 24px">
<div style="height: 220px; border-radius: 18px; background: #fdf1e8; overflow: hidden"><svg width="100%" height="100%" viewBox="0 0 300 220" aria-hidden="true">
<rect x="28" y="34" width="160" height="152" rx="12" fill="#ffffff" stroke="#e7e5e4"></rect>
<rect x="42" y="48" width="70" height="8" rx="4" fill="#1d1d1b"></rect>
<rect x="42" y="68" width="132" height="22" rx="6" fill="#faf7f2" stroke="#e7e5e4"></rect>
<rect class="sv-type" x="50" y="76" width="96" height="6" rx="3" fill="#57534e"></rect>
<rect x="42" y="100" width="132" height="22" rx="6" fill="#faf7f2" stroke="#e7e5e4"></rect>

<rect x="42" y="132" width="132" height="22" rx="6" fill="#faf7f2" stroke="#e7e5e4"></rect>
<rect class="sv-type sv-type3" x="50" y="140" width="108" height="6" rx="3" fill="#57534e"></rect>
<rect x="42" y="162" width="56" height="14" rx="7" fill="#e46212"></rect>
<path d="M200 96c18 0 22-24 40-24" fill="none" stroke="#e46212" stroke-width="3" stroke-dasharray="4 6" stroke-linecap="round"></path>
<rect x="206" y="44" width="72" height="46" rx="14" fill="#1d1d1b"></rect>
<path d="M222 90l-6 12 16-12z" fill="#1d1d1b"></path>
<circle class="sv-dot" cx="228" cy="67" r="4.5" fill="#fafaf9"></circle>
<circle class="sv-dot sv-dot2" cx="242" cy="67" r="4.5" fill="#fafaf9"></circle>
<circle class="sv-dot sv-dot3" cx="256" cy="67" r="4.5" fill="#fafaf9"></circle>
<g transform="translate(244 152)"><path class="sv-spark" d="M0-26C3-8 8-3 26 0 8 3 3 8 0 26-3 8-8 3-26 0-8-3-3-8 0-26z" fill="#e46212"></path></g>
<g transform="translate(212 128)"><path class="sv-spark" d="M0-11C1.3-3.4 3.4-1.3 11 0 3.4 1.3 1.3 3.4 0 11-1.3 3.4-3.4 1.3-11 0-3.4-1.3-1.3-3.4 0-11z" fill="#f6b98e"></path></g>
</svg></div>
<div style="display: flex; flex-direction: column; gap: 6px; padding: 0 12px"><div style="font-size: 32px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1">Intelligence artificielle</div><div style="font-size: 24px; color: #57534e">dans vos outils</div></div>
</div>

</div>
</div>
<p style="position: absolute; left: 0; right: 0; bottom: 36px; margin: 0; text-align: center; font-size: 22px; line-height: 1.4; color: #57534e; font-weight: 400">On développe · On audite · On branche l'IA là où elle vous fait gagner du temps.</p>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent": {"editor": "color", "default": "#e46212", "options": ["#e46212", "#c2410c", "#1d1d1b"]}, "$preview": {"width": 1280, "height": 720}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#e46212' };
  }
}
</script>
</body>
</html>
