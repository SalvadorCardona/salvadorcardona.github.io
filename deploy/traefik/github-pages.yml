# Sous-sites GitHub Pages servis sous hermez.dev/<projet>/.
#
# Une fois le domaine sur Dokploy, Traefik renvoie ces chemins vers
# salvadorcardona.github.io/<projet>/, en conservant le chemin complet :
# /whisper-desk/assets/app.js → https://salvadorcardona.github.io/whisper-desk/assets/app.js.
# Le reste de hermez.dev va à l'application Dokploy du site. Sur
# cardona.digital, ces chemins suivent la redirection 301 de tout le domaine
# vers hermez.dev (cardona-redirect.yml), puis arrivent ici.
#
# À déposer dans le dossier de configuration dynamique de Traefik sur le
# serveur Dokploy (/etc/dokploy/traefik/dynamic/github-pages.yml), à la main ou
# par « Web Server → Traefik → File System » : voir DEPLOY.md, étape 6.
#
# PRÉREQUIS : retirer le domaine personnalisé du dépôt
# salvadorcardona.github.io (Settings → Pages → Custom domain). Tant qu'il y
# est, GitHub répond à salvadorcardona.github.io/<projet>/ par un 301 vers
# hermez.dev/<projet>/, qui repasse par ce proxy : boucle de redirection.
#
# Sous-chemins recensés le 2026-09-30 (dépôts SalvadorCardona avec Pages
# actif, tous en 200 sur cardona.digital) :
#   - /adam/ (ex-/mobile-factory/, dépôt renommé le 2026-10-14)
#   - /adam-eve/
#   - /CoookingPubSub/
#   - /des-3d/
#   - /gnome-claude-usage/
#   - /react-data-form/
#   - /react-game/
#   - /react-resource-view/
#   - /trigo-js/
#   - /whisper-desk/
# Un nouveau dépôt publié sur Pages s'ajoute aux deux règles ci-dessous.

http:
  routers:
    # Priorité au-dessus du routeur de l'application (Host seul), sinon le site
    # TanStack prendrait ces chemins et répondrait 404.
    github-pages:
      entryPoints:
        - websecure
      rule: >-
        Host(`hermez.dev`) && (
        PathPrefix(`/adam/`) ||
        PathPrefix(`/adam-eve/`) ||
        PathPrefix(`/CoookingPubSub/`) ||
        PathPrefix(`/des-3d/`) ||
        PathPrefix(`/gnome-claude-usage/`) ||
        PathPrefix(`/react-data-form/`) ||
        PathPrefix(`/react-game/`) ||
        PathPrefix(`/react-resource-view/`) ||
        PathPrefix(`/trigo-js/`) ||
        PathPrefix(`/whisper-desk/`))
      priority: 1000
      service: github-pages
      tls:
        certResolver: letsencrypt

    # Sans slash final, Pages répondrait par un 301 vers sa propre adresse
    # (salvadorcardona.github.io) : on ajoute le slash ici, sur hermez.dev.
    github-pages-slash:
      entryPoints:
        - websecure
      rule: >-
        Host(`hermez.dev`) && (
        Path(`/adam`) ||
        Path(`/adam-eve`) ||
        Path(`/CoookingPubSub`) ||
        Path(`/des-3d`) ||
        Path(`/gnome-claude-usage`) ||
        Path(`/react-data-form`) ||
        Path(`/react-game`) ||
        Path(`/react-resource-view`) ||
        Path(`/trigo-js`) ||
        Path(`/whisper-desk`))
      priority: 1000
      middlewares:
        - github-pages-slash
      service: github-pages
      tls:
        certResolver: letsencrypt

    # Idem pour une page sous un sous-site (/react-resource-view/docs/form) : sans
    # slash final, Pages répond par un 301 vers salvadorcardona.github.io et le
    # visiteur quitte hermez.dev. Seuls /react-resource-view/ et ses pages
    # sont concernés ; un fichier (dernier segment avec un point) est servi tel quel.
    react-resource-view-page-slash:
      entryPoints:
        - websecure
      rule: >-
        Host(`hermez.dev`) &&
        PathRegexp(`^/react-resource-view/([^/]+/)*[^/.]+$`)
      priority: 1000
      middlewares:
        - react-resource-view-page-slash
      service: github-pages
      tls:
        certResolver: letsencrypt

    # Ponos a quitté cardona.digital pour son propre domaine (the-ponos.app,
    # GitHub Pages avec domaine personnalisé, le 2026-10-08). /ponos/… et
    # l'ancien /ticket-runner/… (le dépôt avant son renommage du 2026-10-02)
    # sont renvoyés en 301 vers la même page là-bas.
    ponos-to-the-ponos-app:
      entryPoints:
        - websecure
      rule: >-
        Host(`hermez.dev`) && (
        Path(`/ponos`) ||
        PathPrefix(`/ponos/`) ||
        Path(`/ticket-runner`) ||
        PathPrefix(`/ticket-runner/`))
      priority: 1000
      middlewares:
        - ponos-to-the-ponos-app
      service: github-pages
      tls:
        certResolver: letsencrypt

    # Le jeu s'appelait Mobile Factory (renommé Adam le 2026-10-14) : l'ancien
    # chemin est renvoyé en 301 vers /adam/…, chemin et requête gardés (le
    # navigateur garde le fragment). Même origine : les clés du jeu sont déjà là.
    mobile-factory-to-adam:
      entryPoints:
        - websecure
      rule: >-
        Host(`hermez.dev`) && (
        Path(`/mobile-factory`) ||
        PathPrefix(`/mobile-factory/`))
      priority: 1000
      middlewares:
        - mobile-factory-to-adam
      service: github-pages
      tls:
        certResolver: letsencrypt

  middlewares:
    mobile-factory-to-adam:
      redirectRegex:
        regex: ^https?://[^/]+/mobile-factory/?([^?]*)(\?.*)?$
        replacement: https://hermez.dev/adam/${1}${2}
        permanent: true

    ponos-to-the-ponos-app:
      redirectRegex:
        regex: ^https?://[^/]+/(?:ponos|ticket-runner)/?(.*)$
        replacement: https://the-ponos.app/${1}
        permanent: true

    github-pages-slash:
      redirectRegex:
        regex: ^(https?://[^/]+/[^/?]+)(\?.*)?$
        replacement: ${1}/${2}
        permanent: true

    react-resource-view-page-slash:
      redirectRegex:
        regex: ^(https?://[^/]+/react-resource-view/[^?]*[^/?])(\?.*)?$
        replacement: ${1}/${2}
        permanent: true

  services:
    github-pages:
      loadBalancer:
        # GitHub sert le site d'après l'en-tête Host : il doit recevoir
        # salvadorcardona.github.io, pas hermez.dev.
        passHostHeader: false
        servers:
          - url: https://salvadorcardona.github.io
