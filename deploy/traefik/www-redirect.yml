# Redirection www.hermez.dev → hermez.dev.
#
# Le domaine www.hermez.dev est déclaré dans Dokploy sur l'application du
# site, avec le middleware `www-to-apex@file` : Traefik répond par un 301 vers
# l'apex en conservant le chemin et la query string.
#
# À déposer dans le dossier de configuration dynamique de Traefik sur le
# serveur Dokploy (/etc/dokploy/traefik/dynamic/www-redirect.yml) : voir
# DEPLOY.md, étape 4.

http:
  middlewares:
    www-to-apex:
      redirectRegex:
        regex: ^https?://www\.hermez\.dev/(.*)
        replacement: https://hermez.dev/${1}
        permanent: true
